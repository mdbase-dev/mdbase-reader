version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # mdbase packages are pinned prereleases, bumped deliberately alongside contract changes.
    ignore:
      - dependency-name: "@callumalpass/mdbase"
      - dependency-name: "@mdbase-dev/*"
      # typescript-eslint does not support TypeScript 7 yet; lint cannot run on it.
      - dependency-name: "typescript"
        versions: [">= 7"]
      # dockview-react 8.5.0 leaves Reader's mobile Library panel blank (audit-reader, PDF touch).
      - dependency-name: "dockview-react"
        versions: [">= 8.5.0"]
    groups:
      npm-development:
        dependency-type: development
      npm-production:
        dependency-type: production
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      workflow-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
