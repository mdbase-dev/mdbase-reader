version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # mdbase packages are pinned prereleases, bumped deliberately alongside contract changes.
    ignore:
      - dependency-name: "@callumalpass/mdbase"
      - dependency-name: "@mdbase-dev/*"
    groups:
      npm-development:
        dependency-type: development
      npm-production:
        dependency-type: production
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      workflow-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
