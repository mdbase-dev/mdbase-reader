name: Release

# Push `extension-v<version>` or `zotero-exporter-v<version>`, matching that app's package.json.
on:
  push:
    tags:
      - extension-v*
      - zotero-exporter-v*

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Package and publish ${{ github.ref_name }}
    needs: ci
    outputs:
      app: ${{ steps.app.outputs.app }}
      prerelease: ${{ steps.app.outputs.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      MDBASE_ENV: production
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Resolve app and version
        id: app
        run: |
          case "$TAG" in
            extension-v*) app=extension; title="Browser extension" ;;
            zotero-exporter-v*) app=zotero-exporter; title="Zotero exporter" ;;
            *) echo "::error::Unrecognised release tag $TAG"; exit 1 ;;
          esac
          version="${TAG#"$app-v"}"
          declared=$(jq -r .version "apps/$app/package.json")
          if [ "$version" != "$declared" ]; then
            echo "::error::Tag $TAG does not match apps/$app/package.json version $declared."
            exit 1
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "app=$app"
            echo "title=$title"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Package browser extension
        if: steps.app.outputs.app == 'extension'
        run: |
          pnpm --filter @mdbase-reader/extension package
          mkdir -p "$RUNNER_TEMP/release"
          cp apps/extension/release/*.zip "$RUNNER_TEMP/release/"

      - name: Package Zotero exporter
        if: steps.app.outputs.app == 'zotero-exporter'
        run: |
          pnpm --filter @mdbase-reader/zotero-exporter build
          mkdir -p "$RUNNER_TEMP/release"
          cp apps/zotero-exporter/dist/*.xpi "$RUNNER_TEMP/release/"

      - name: Verify tree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Packaging changed tracked or unignored files."
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.app.outputs.title }} ${{ steps.app.outputs.version }}
          PRERELEASE: ${{ steps.app.outputs.prerelease }}
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum -- * > SHA256SUMS
          {
            echo "Built from \`$GITHUB_SHA\` by [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) for \`$MDBASE_ENV\`."
            echo
            echo '```text'
            cat SHA256SUMS
            echo '```'
          } > notes.md
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TITLE" --notes-file notes.md "${flags[@]}" -- \
            $(ls | grep -v '^notes.md$')

  webstore:
    name: Submit extension to Chrome Web Store
    needs: release
    if: needs.release.outputs.app == 'extension' && needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: reader-extension-production
    concurrency:
      group: reader-chrome-web-store
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Download and verify the exact GitHub release package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#extension-v}"
          archive="mdbase-reader-$version.zip"
          mkdir -p "$RUNNER_TEMP/webstore"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" --pattern SHA256SUMS --dir "$RUNNER_TEMP/webstore"
          cd "$RUNNER_TEMP/webstore"
          awk -v file="$archive" '$2 == file { print; found=1 } END { if (!found) exit 1 }' SHA256SUMS > package.sha256
          sha256sum --check package.sha256
      - name: Authenticate to Google with short-lived GitHub identity
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
      - name: Upload and submit for review
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
        run: |
          version="${GITHUB_REF_NAME#extension-v}"
          node apps/extension/scripts/publish-webstore.mjs "$RUNNER_TEMP/webstore/mdbase-reader-$version.zip"
