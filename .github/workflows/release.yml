name: Release Zotero exporter

on:
  push:
    tags:
      - zotero-exporter-v*

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Package and publish ${{ github.ref_name }}
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      MDBASE_ENV: production
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve exporter version
        id: version
        run: |
          version="${TAG#zotero-exporter-v}"
          test "$version" = "$(jq -r .version apps/zotero-exporter/package.json)"
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          printf 'version=%s\nprerelease=%s\n' "$version" "$prerelease" >> "$GITHUB_OUTPUT"
      - run: pnpm --filter @mdbase-reader/zotero-exporter build
      - name: Verify tree is clean
        run: test -z "$(git status --porcelain)"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp apps/zotero-exporter/dist/*.xpi "$RUNNER_TEMP/release/"
          cd "$RUNNER_TEMP/release"
          sha256sum -- *.xpi > SHA256SUMS
          printf 'Built from `%s` by run %s for production.\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > notes.md
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Zotero exporter $VERSION" --notes-file notes.md "${flags[@]}" -- *.xpi SHA256SUMS
