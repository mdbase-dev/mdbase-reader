name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  # Reusable calls inherit the caller's workflow name, so deployments never cancel CI.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Tests assume the default (lab) environment.
      - run: pnpm check
      # Generated manifests are committed for production; building for it must leave the tree clean.
      - run: pnpm build
        env:
          MDBASE_ENV: production
      - name: Verify generated files are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::The build changed tracked or unignored files. Regenerate and commit them."
            exit 1
          fi

  deploy-lab:
    name: Deploy Reader to lab
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-reader-lab
      cancel-in-progress: false
    environment:
      name: reader-lab
      url: https://lab.mdbase-reader.pages.dev/
    env:
      MDBASE_ENV: lab
    steps:
      # Lab deploys are automatic; without credentials they are skipped
      # visibly rather than turning every main build red.
      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=true" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::Lab deploy skipped: the reader-lab environment has no CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit). Deploy locally with pnpm deploy:dev."
            echo "configured=false" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.credentials.outputs.configured == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.credentials.outputs.configured == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - if: steps.credentials.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.credentials.outputs.configured == 'true'
        run: pnpm deploy:dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
