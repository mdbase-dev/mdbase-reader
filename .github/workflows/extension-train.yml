name: Extension release train

on:
  schedule:
    - cron: "30 22 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: extension-release-train
  cancel-in-progress: false

jobs:
  tag:
    if: vars.EXTENSION_TRAIN_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: reader-extension-production
    concurrency:
      group: reader-chrome-web-store
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      EXTENSION_TRAIN_ENABLED: ${{ vars.EXTENSION_TRAIN_ENABLED }}
      MDBASE_ENV: production
    steps:
      - name: Mint the release automation App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Authenticate for read-only store preflight
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore.readonly
          create_credentials_file: false
      - name: Defer pending reviews before building or tagging
        id: store
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
        run: node scripts/extension-release.mjs preflight
      - if: steps.store.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build the actual shipping ZIP
        if: steps.store.outputs.ready == 'true'
        run: pnpm --filter @mdbase-reader/extension package
      - name: Compare successful-submission ZIP and tag changed content
        if: steps.store.outputs.ready == 'true'
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          GH_TOKEN: ${{ github.token }}
          CWS_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          node scripts/extension-release.mjs tag
