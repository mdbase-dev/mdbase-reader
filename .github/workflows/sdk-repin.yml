name: Repin production Connect packages

on:
  workflow_dispatch:
    inputs:
      connect_release:
        description: Production-verified Connect tag (v0.1.0-beta.N)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sdk-repin
  cancel-in-progress: false

jobs:
  repin:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Mint the release automation App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Mint read-only access to the production record
        id: ops
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: mdbase-dev
          repositories: mdbase-cloud-ops
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate production identity and plan exact pins
        id: pins
        env:
          GH_TOKEN: ${{ steps.ops.outputs.token }}
          CONNECT_RELEASE: ${{ inputs.connect_release }}
        run: node scripts/sdk-repin.mjs
      - name: Refresh the existing lockfile
        if: steps.pins.outputs.changed == 'true'
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Open or update the single release PR
        if: steps.pins.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          CONNECT_RELEASE: ${{ inputs.connect_release }}
          CONNECT_COMMIT: ${{ steps.pins.outputs.commit }}
        run: |
          if git diff --quiet; then exit 0; fi
          branch=automation/sdk-repin
          previous=$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')
          git switch --create "$branch"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git ls-files -z -- '*package.json' pnpm-lock.yaml | xargs -0 git add --
          git diff --cached --quiet && exit 0
          git commit -m "Pin production Connect packages to $CONNECT_RELEASE"
          git push --force-with-lease="refs/heads/$branch:$previous" origin "HEAD:refs/heads/$branch"
          title="Pin production Connect packages to $CONNECT_RELEASE"
          body=$(printf 'Connect: %s, commit %s.\n\nTrain run: https://github.com/%s/actions/runs/%s\n\nExact npm pins and pnpm lockfile only. App CI and normal branch protections gate auto-merge. Reader web uses the existing production publisher on dependency merges; extension version/tag/store handoff remains separate.\n' "$CONNECT_RELEASE" "$CONNECT_COMMIT" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          pull=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$pull" ]; then
            gh pr edit "$pull" --title "$title" --body "$body"
          else
            gh pr create --head "$branch" --base main --title "$title" --body "$body"
            pull=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number')
          fi
          gh pr merge "$pull" --auto --squash
