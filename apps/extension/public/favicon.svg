    <rect x="1" y="5" width="2" height="2"/><rect x="1" y="9" width="5" height="2"/><rect x="7" y="9" width="8" height="2"/>
    <rect x="1" y="13" width="4" height="2"/><rect x="6" y="13" width="4" height="2"/><rect x="11" y="13" width="4" height="2"/>
