<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The on-screen keyboard shrinks the layout instead of covering it, so docked inputs (a
         highlight's comment) stay above it. Android Chrome and Firefox honour this. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f4f0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>mdbase reader</title>
    <style>
      .reader-boot {
        color: light-dark(#343431, #e2ded8);
        background: light-dark(#f7f4f0, #1c1d1c);
        font: 16px/1.5 system-ui;
        min-height: 100dvh;
        display: grid;
        grid-template: 50px 1fr / 260px 1fr;
      }
      .reader-boot header {
        border-bottom: 1px solid light-dark(#dedbd5, #44443e);
        grid-column: 1 / -1;
        padding: 12px 20px;
      }
      .reader-boot-sidebar {
        grid-row: 2;
        border-right: 1px solid light-dark(#dedbd5, #44443e);
      }
      .reader-boot-content {
        padding: 24px;
      }
      .reader-boot-bars {
        max-width: 720px;
        margin: 40px auto;
      }
      .reader-boot-bars span {
        display: block;
        height: 24px;
        margin-block: 20px;
        background: light-dark(#e5e2dc, #343530);
        border-radius: 3px;
      }
      .reader-boot-bars span:nth-child(2) {
        width: 72%;
      }
      .reader-boot details {
        max-width: 720px;
        margin: 40px auto;
      }
      body:has(.reader-boot) {
        margin: 0;
      }
      @media (max-width: 680px) {
        .reader-boot {
          grid-template-columns: 0 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="reader-boot" aria-label="Loading Reader">
        <header>mdbase reader</header>
        <aside class="reader-boot-sidebar" aria-hidden="true"></aside>
        <div class="reader-boot-content">
          <div class="reader-boot-bars" role="status">
            Loading Reader…
            <span aria-hidden="true"></span><span aria-hidden="true"></span
            ><span aria-hidden="true"></span>
          </div>
          <details>
            <summary>Reader not opening?</summary>
            <p>
              Check your connection, then <a href="">reload Reader</a>. JavaScript must be enabled.
            </p>
            <p><a href="?preview=1">Try Reader with a sample library</a></p>
          </details>
          <p class="reader-boot-failure" role="alert" hidden></p>
        </div>
      </main>
    </div>
    <script>
      function readerBootFailed(event) {
        const failure = document.querySelector(".reader-boot-failure");
        if (!failure) return;
        failure.hidden = false;
        failure.textContent =
          "Reader could not start: " +
          (
            event.reason?.message ||
            event.message ||
            "the application files could not load."
          ).replace(/^Uncaught (?:Error:\s*)?/, "");
      }
      window.addEventListener("error", readerBootFailed, true);
      window.addEventListener("unhandledrejection", readerBootFailed);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
